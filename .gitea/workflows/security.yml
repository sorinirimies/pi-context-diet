name: Security

on:
  schedule:
    - cron: "30 3 * * *" # GitHub runs at 03:00
  push:
    branches: [main]
    paths: ["bun.lock", "package.json"]
  pull_request:
    paths: ["bun.lock", "package.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Audit dependencies (fails on any known vulnerability)
        run: bun audit
