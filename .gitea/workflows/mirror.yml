name: Mirror GitHub

# GitHub is the single source of truth for main: Dependabot, auto-merge, the nightly
# dependency update and the Gitea action bumps all commit THERE (this LAN host is not
# reachable from GitHub's runners, so GitHub cannot push here). This job brings every
# new commit and tag over, so the two hosts never diverge again (they did while each ran
# its own nightly).
#
#   Gitea behind GitHub  -> fast-forward main, push the new tags, start release.yml for
#                           each new tag (Gitea release page; the npm publish is idempotent)
#   equal / Gitea ahead  -> nothing (ahead = a local push GitHub has not seen yet)
#   diverged             -> FAIL: someone committed to one host only; merge by hand
#
# A local `git push origin` reaches both hosts anyway; this only covers commits made on
# GitHub itself.

on:
  schedule:
    - cron: "30 * * * *" # hourly; cheap (a fetch), and the 02:00 UTC GitHub nightly lands by 02:30
  workflow_dispatch:

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Fast-forward from GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.GITEA_TOKEN || github.token }}
          fetch-depth: 0

      - name: Fetch GitHub
        run: |
          git fetch --tags --force origin main
          git remote add github "https://github.com/sorinirimies/${GITHUB_REPOSITORY#*/}.git"
          git fetch --no-tags github main
          git fetch github '+refs/tags/*:refs/tags/*'
          echo "gitea:  $(git log -1 --oneline origin/main)"
          echo "github: $(git log -1 --oneline github/main)"

      - name: Fast-forward main and push new tags
        id: sync
        run: |
          set -euo pipefail
          G=$(git rev-parse github/main); L=$(git rev-parse origin/main)
          if [ "$G" = "$L" ] || git merge-base --is-ancestor "$G" "$L"; then
            echo "✅ main is up to date with GitHub."
          elif git merge-base --is-ancestor "$L" "$G"; then
            git push origin "$G:refs/heads/main"
            echo "⏩ main fast-forwarded to $(git log -1 --oneline "$G")"
          else
            echo "::error::Gitea and GitHub main have diverged ($(git rev-list --count "$G..$L") commit(s) only here, $(git rev-list --count "$L..$G") only on GitHub). Merge them locally and push to both."
            exit 1
          fi
          # Tags GitHub has that this host lacks (only those on GitHub's main history).
          git ls-remote --tags origin | sed -n 's#.*refs/tags/\([^^]*\)$#\1#p' | sort -u > here.txt
          NEW=$(git tag --merged "$G" | sort -u | comm -13 here.txt - | tr '\n' ' ')
          rm here.txt
          for t in $NEW; do git push origin "refs/tags/$t"; done
          echo "tags=$NEW" >> "$GITHUB_OUTPUT"
          [ -z "$NEW" ] || echo "🏷  pushed tags: $NEW"

      # Tag pushes made with the built-in token don't always trigger workflows on Gitea,
      # so start the release explicitly (its concurrency group makes a duplicate harmless).
      - name: Trigger release workflow for new tags
        if: steps.sync.outputs.tags != ''
        run: |
          for TAG in ${{ steps.sync.outputs.tags }}; do
            echo "🚀 Dispatching release.yml for ${TAG}…"
            curl -sf -X POST \
              "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
              -H "Authorization: token ${{ secrets.GITEA_TOKEN || github.token }}" \
              -H "Content-Type: application/json" \
              -d "{\"ref\": \"main\", \"inputs\": {\"tag\": \"${TAG}\"}}" \
              || echo "⚠️  Dispatch failed — the tag push may already have started the release."
          done
