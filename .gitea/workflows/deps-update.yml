name: Nightly Dependency Update

# Fully automatic, no human in the loop. Every night, against the CURRENT tip of main:
#   1. `bun update` (compatible bumps only); continue only if something REALLY moved up,
#   2. typecheck + tests + pack check,
#   3. commit the lockfile (`chore(deps)`),
#   4. when something is worth shipping (a library upgraded or merged, or feat/fix/perf
#      commits since the last tag): bump the patch version, tag vX.Y.Z, push main + tag,
#      and dispatch release.yml (publishes to npm).
# No changes => no commit, no tag, no release.
#
# This host runs on its own: no mirroring to GitHub (it has its own nightly,
# .github/workflows/deps-update.yml). npm publishing is idempotent, so a version released
# by both hosts is published once. Single job on purpose: Gitea has no artifact v4.

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC (GitHub runs at 02:00)
  workflow_dispatch:

# Never cancel mid-run: a half-finished push/tag would leave main inconsistent.
concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  update-deps:
    name: Update dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          token: ${{ secrets.GITEA_TOKEN || github.token }}
          fetch-depth: 0

      # Scheduled runs can start from a stale commit: always work on the real tip of main.
      - name: Sync to latest main
        run: |
          git fetch --tags --force origin main
          git checkout -B main origin/main
          git reset --hard origin/main
          git log -1 --oneline

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install nushell
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3
        with:
          version: "0.111.0"

      - run: bun install --frozen-lockfile

      - name: Snapshot installed versions (before)
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          nu scripts/ci/snapshot_deps.nu "$T/before-all.txt"

      - name: Update dependencies (within their ranges)
        run: |
          bun update
          bun install

      # Only a REAL upgrade counts: `changed` = anything moved up and nothing down (scripts/ci/dep_changes.nu).
      - name: Check what changed
        id: deps
        run: |
          T="${RUNNER_TEMP:-/tmp}"
          nu scripts/ci/snapshot_deps.nu "$T/after-all.txt"
          if git diff --quiet -- bun.lock package.json; then
            echo "No dependency changes detected."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            nu scripts/ci/dep_changes.nu "$T/before-all.txt"  "$T/after-all.txt"  --key changed --output "$GITHUB_OUTPUT"
          fi
          # Never leave a half-applied update behind when it is not an upgrade.
          if grep -q '^changed=false' "$GITHUB_OUTPUT"; then git checkout -- bun.lock package.json; fi

      - name: Unreleased feat/fix/perf commits?
        id: unreleased
        run: nu scripts/ci/unreleased.nu --output "$GITHUB_OUTPUT"

      - name: Quality gate
        if: steps.deps.outputs.changed == 'true' || steps.unreleased.outputs.releasable == 'true'
        run: |
          bun install --frozen-lockfile
          nu scripts/ci/quality_gate.nu

      - name: Install git-cliff
        if: steps.deps.outputs.changed == 'true' || steps.unreleased.outputs.releasable == 'true'
        continue-on-error: true
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: git-cliff

      - name: Commit updated dependencies
        if: steps.deps.outputs.changed == 'true'
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"
          git add package.json bun.lock
          git commit -m "chore(deps): nightly update $(date -u '+%Y-%m-%d')"

      - name: Bump patch version, changelog, commit and tag
        id: bump
        if: steps.deps.outputs.changed == 'true' || steps.unreleased.outputs.releasable == 'true'
        run: |
          git config user.name  "gitea-actions[bot]"
          git config user.email "gitea-actions[bot]@noreply.gitea"
          nu scripts/bump_version.nu patch --yes --skip-checks
          echo "tag=v$(nu scripts/version.nu)" >> "$GITHUB_OUTPUT"

      # Fail loudly (no `|| true`): a failed push must show as a failed run.
      - name: Push to Gitea
        if: steps.deps.outputs.changed == 'true' || steps.bump.outputs.tag != ''
        run: |
          git push origin HEAD:main
          if [ -n "${{ steps.bump.outputs.tag }}" ]; then git push origin "${{ steps.bump.outputs.tag }}"; fi

      # Tag pushes made with the built-in token don't always trigger workflows on Gitea,
      # so start the release explicitly (the release workflow's concurrency group makes
      # a duplicate harmless).
      - name: Trigger release workflow for the new tag
        if: steps.bump.outputs.tag != ''
        run: |
          TAG="${{ steps.bump.outputs.tag }}"
          echo "🚀 Dispatching release.yml for ${TAG}…"
          curl -sf -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/actions/workflows/release.yml/dispatches" \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN || github.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"main\", \"inputs\": {\"tag\": \"${TAG}\"}}" \
            || echo "⚠️  Dispatch failed — the tag push may already have started the release."

      - name: Nothing to do
        if: steps.deps.outputs.changed != 'true' && steps.unreleased.outputs.releasable != 'true'
        run: echo "✅ Dependencies up to date and nothing unreleased — no commit, no release."
