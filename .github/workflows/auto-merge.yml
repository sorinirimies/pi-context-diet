# ──────────────────────────────────────────────────────────────────────────────
# Auto-merge library updates — after CI is green, then ship a patch
# ──────────────────────────────────────────────────────────────────────────────
# Dependabot keeps the GitHub Actions in .github/workflows up to date (see dependabot.yml).
# npm dependencies are updated by the nightly job (deps-update.yml), which commits straight
# to main; the actions in .gitea/workflows by gitea-actions.yml.
#
# This workflow merges a Dependabot PR only AFTER the CI workflow finished successfully
# for that exact commit (this repo has no branch protection, so `gh pr merge --auto` would
# merge immediately). Patch and minor updates merge on their own; a major update, or one
# that cannot be classified, waits for a person (scripts/ci/update_type.nu).
#
# Action bumps always change .github/workflows/*, which GITHUB_TOKEN may not merge: set the
# GH_PAT secret (classic PAT, `repo` + `workflow` scopes), or every merge fails loudly.
#
# After a merge it starts the nightly workflow with release=true. A `ci(deps)` action bump
# alone is not released (scripts/ci/unreleased.nu); the nightly ships a patch only when a
# runtime dependency moved or feat/fix/perf commits are waiting.
# ──────────────────────────────────────────────────────────────────────────────

name: Auto-merge library updates

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    name: Merge after CI, then release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      # The default branch: trusted scripts, never the PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3
        with:
          version: "0.111.0"

      - name: Find the pull request
        id: pr
        run: |
          number=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number -q '.[0].number')
          if [ -z "$number" ]; then echo "No open PR for $HEAD_BRANCH (already merged or closed)."; echo "number=" >> "$GITHUB_OUTPUT"; exit 0; fi
          current=$(gh pr view "$number" --repo "$REPO" --json headRefOid -q .headRefOid)
          # CI must have passed for the commit that is on the PR NOW
          if [ "$current" != "$HEAD_SHA" ]; then echo "PR head moved on ($current != $HEAD_SHA); a newer CI run will decide."; echo "number=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Classify the update
        id: kind
        if: steps.pr.outputs.number != ''
        run: |
          title=$(gh pr view "$NUMBER" --repo "$REPO" --json title -q .title)
          messages=$(gh pr view "$NUMBER" --repo "$REPO" --json commits -q '.commits[].messageBody')
          echo "PR #$NUMBER: $title"
          nu scripts/ci/update_type.nu --title "$title" --messages "$messages" --output "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}

      - name: Merge (squash)
        id: merge
        if: steps.kind.outputs.automerge == 'true'
        run: |
          # GITHUB_TOKEN cannot merge a PR that changes .github/workflows/* (it lacks the
          # `workflows` permission), and cannot approve PRs. Use the GH_PAT secret
          # (classic PAT with `repo` + `workflow`) when set; no approval is required.
          if ! gh pr merge "$NUMBER" --repo "$REPO" --squash --delete-branch; then
            echo "::error::Merge failed. Workflow-file PRs need a GH_PAT secret (repo + workflow scopes)."
            exit 1
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}

      - name: Needs a human
        if: steps.kind.outputs.automerge == 'false'
        run: |
          echo "::notice::PR ${NUMBER} is a ${KIND} update, so it is not auto-merged. Review it by hand."
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          KIND: ${{ steps.kind.outputs.type }}

      # Starts the nightly: it ships a patch when there is something releasable.
      - name: Run the nightly
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run deps-update.yml --repo "$REPO" -f release=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
