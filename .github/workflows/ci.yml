name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch / PR supersedes a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The same gate `just check` and the release run: typecheck + tests + pack + nu tests.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install nushell
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3
        with:
          version: "0.111.0"

      - run: bun install --frozen-lockfile

      - name: Quality gate (coverage thresholds are enforced by bunfig.toml)
        run: nu scripts/ci/quality_gate.nu

      - name: Coverage summary
        if: always()
        run: nu scripts/ci/coverage_summary.nu --output "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  # Paths, terminals and time zones differ: run the suite where users run pi.
  test:
    name: test (${{ matrix.os }}${{ matrix.tz && format(', {0}', matrix.tz) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest }
          - { os: windows-latest }
          # Day/week/month bucketing is local-time: exercise the extremes.
          - { os: ubuntu-latest, tz: Pacific/Auckland }
          - { os: ubuntu-latest, tz: Pacific/Pago_Pago }
          - { os: ubuntu-latest, tz: America/Los_Angeles }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile

      - name: bun test
        run: bun test
        env:
          TZ: ${{ matrix.tz }}
