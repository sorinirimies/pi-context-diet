name: Fuzz

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
    paths: ["tests/fuzz.test.ts", "extensions/**"]
  pull_request:
    paths: ["tests/fuzz.test.ts", "extensions/**"]
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per property
        default: "200000"
      seed:
        description: Seed (empty = random)
        default: ""

permissions:
  contents: read

jobs:
  fuzz:
    name: randomised robustness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - name: Fuzz (a failure prints the seed that reproduces it)
        env:
          FUZZ_ITERS: ${{ github.event.inputs.iterations || (github.event_name == 'schedule' && '200000') || '5000' }}
          FUZZ_SEED: ${{ github.event.inputs.seed }}
        run: |
          [ -n "$FUZZ_SEED" ] || unset FUZZ_SEED
          echo "iterations=$FUZZ_ITERS seed=${FUZZ_SEED:-random}"
          # 200k nightly runs take far longer than bun's 5 s per-test default timeout.
          bun test tests/fuzz.test.ts --config=bunfig.fuzz.toml --timeout=600000
