name: Nightly Dependency Update

# Fully automatic, no human in the loop. Every night, against the CURRENT tip of main:
#   update   `bun update` (compatible bumps only); note whether anything REALLY moved up
#   verify   typecheck + tests + pack check on Linux, tests on macOS and Windows
#   release  commit the lockfile (`chore(deps)`), and, when something worth shipping
#            exists, bump the patch version, tag vX.Y.Z, push and start release.yml
#
# A patch is published when there is something to ship (scripts/ci/unreleased.nu):
#   * any library was upgraded here (runtime or dev tooling), or
#   * a library update was merged since the last tag (Dependabot, via auto-merge.yml), or
#   * feat / fix / perf commits are waiting.
# No changes => nothing is committed, tagged or released.
#
# The only nightly: Gitea has none and copies main + tags from here (.gitea/workflows/
# mirror.yml, hourly), so the two hosts never diverge.
#
# Secrets: NPM_TOKEN is used by release.yml. GH_PAT (optional): lets the tag push itself
# trigger release.yml and bypass branch protection; without it the release is dispatched.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC (Gitea mirrors it within the hour)
  workflow_dispatch:
    inputs:
      release:
        description: "Bump the patch version, tag and release when there is something to ship"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

# Never cancel mid-run: a half-finished push/tag would leave main inconsistent.
concurrency:
  group: deps-update
  cancel-in-progress: false

jobs:
  # ── 1. Update ───────────────────────────────────────────────────────────────
  update:
    name: Update lockfile
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.deps.outputs.changed }}
      ships: ${{ steps.deps.outputs.ships }}
      releasable: ${{ steps.unreleased.outputs.releasable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3
        with:
          version: "0.116.1"

      - run: bun install --frozen-lockfile

      - name: Snapshot installed versions (before)
        run: nu scripts/ci/deps_update.nu snapshot before

      - name: Update dependencies (within their ranges)
        run: nu scripts/ci/deps_update.nu update

      # Only a REAL upgrade counts: `changed` = anything moved up and nothing down (scripts/ci/dep_changes.nu).
      - name: Check what changed
        id: deps
        run: nu scripts/ci/deps_update.nu changed

      - name: Unreleased feat/fix/perf commits?
        id: unreleased
        run: nu scripts/ci/unreleased.nu --output "$GITHUB_OUTPUT"

      - name: Upload updated lockfile
        if: steps.deps.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lockfile
          path: |
            package.json
            bun.lock
          retention-days: 1

  # ── 2. Verify on every platform ─────────────────────────────────────────────
  verify:
    name: verify (${{ matrix.os }})
    needs: update
    if: needs.update.outputs.changed == 'true' || needs.update.outputs.releasable == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.update.outputs.changed == 'true'
        with:
          name: lockfile

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install nushell
        if: runner.os == 'Linux'
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3
        with:
          version: "0.116.1"

      - run: bun install --frozen-lockfile

      - name: Quality gate
        if: runner.os == 'Linux'
        run: nu scripts/ci/quality_gate.nu

      - name: Typecheck
        if: runner.os != 'Linux'
        run: bun run typecheck

      - name: Tests
        if: runner.os != 'Linux'
        run: bun test

  # ── 3. Commit, bump, tag, push, release ─────────────────────────────────────
  release:
    name: Commit and release
    needs: [update, verify]
    if: (needs.update.outputs.changed == 'true' || needs.update.outputs.releasable == 'true') && (github.event_name == 'schedule' || inputs.release)
    runs-on: ubuntu-latest
    env:
      HAS_PAT: ${{ secrets.GH_PAT != '' }}
    steps:
      # Re-sync to the REAL tip of main: it may have moved while the checks ran.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.update.outputs.changed == 'true'
        with:
          name: lockfile

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3
        with:
          version: "0.116.1"

      - name: Install git-cliff
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: git-cliff

      # Fails (safely) if main's manifest changed in the meantime and the verified
      # lockfile no longer matches it.
      - name: Verify the lockfile still matches the manifest
        run: bun install --frozen-lockfile

      - name: Git identity
        run: nu scripts/ci/deps_update.nu bot "github-actions[bot]" "github-actions[bot]@users.noreply.github.com"

      - name: Commit updated dependencies
        if: needs.update.outputs.changed == 'true'
        run: nu scripts/ci/deps_update.nu commit "${{ needs.update.outputs.ships }}"

      - name: Bump patch version, changelog, commit and tag
        id: bump
        if: needs.update.outputs.ships == 'true' || needs.update.outputs.releasable == 'true'
        run: nu scripts/ci/deps_update.nu bump

      # Fail loudly (no `|| true`): a failed push must show as a failed run.
      - name: Push
        run: nu scripts/ci/deps_update.nu push "${{ steps.bump.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      # Pushes authored by GITHUB_TOKEN do NOT trigger other workflows (GitHub's
      # anti-recursion guard), so dispatch release.yml explicitly. With a PAT the tag
      # push already started it — dispatching again would only duplicate the run.
      - name: Trigger release workflow for the new tag
        if: steps.bump.outputs.tag != '' && env.HAS_PAT != 'true'
        run: gh workflow run release.yml --repo "${{ github.repository }}" -f tag="${{ steps.bump.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
