name: Release

# Publishes the package to npm when a vX.Y.Z tag is pushed (or dispatched).
# Safe to re-run: publishing is idempotent (skipped when the version is on npm).
#
# Secret: NPM_TOKEN — an npm granular access token with "bypass 2FA" and publish
# rights on this package.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.1)"
        required: true

permissions:
  contents: write
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, publish, release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install nushell
        uses: hustcer/setup-nu@95cd3bfe252450ef7d35dd9a7ddecf3484341134 # v3
        with:
          version: "0.111.0"

      - name: Install git-cliff
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: git-cliff

      # The tag must be vX.Y.Z and equal the version in package.json.
      - name: Validate tag
        id: tag
        run: nu scripts/ci/validate_tag.nu "$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      - run: bun install --frozen-lockfile

      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

      - name: Publish to npm
        run: nu scripts/ci/npm_publish.nu --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          git-cliff --latest --strip header --output notes.md || echo "Release $TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
