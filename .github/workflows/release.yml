name: Release

# Publishes the package to npm and creates the GitHub release. Three ways in:
#   * push a vX.Y.Z tag (just release <kind>);
#   * Actions → Release → Run workflow with a bump (just release-ci <bump>): runs the gate,
#     bumps package.json + CHANGELOG, commits, tags, pushes main and the tag, publishes.
#     `current` tags the version already in package.json (the first release);
#   * Run workflow with an existing tag: publishes it again.
# Safe to re-run: publishing is idempotent (skipped when the version is on npm).
# Gitea's mirror.yml copies the new commit and tag and runs its own release.yml.
#
# Secret: NPM_TOKEN — an npm granular access token with "bypass 2FA" and publish
# rights on this package.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "New version: patch, minor, major, or current (tag package.json as is: the first release)"
        type: choice
        options: [patch, minor, major, current]
        default: patch
      tag:
        description: "Or publish this existing tag again (e.g. v0.3.1); the bump is then ignored"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Test, publish, release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3
        with:
          version: "0.111.0"

      - name: Install git-cliff
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: git-cliff

      - run: bun install --frozen-lockfile

      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

      # A dispatched bump commits, tags and pushes here; otherwise the tag already exists.
      - name: Tag to release
        id: prepare
        run: nu scripts/ci/release_prepare.nu
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          TAG: ${{ inputs.tag }}
          BUMP: ${{ inputs.bump }}

      # The tag must be vX.Y.Z and equal the version in package.json.
      - name: Validate tag
        id: tag
        run: nu scripts/ci/validate_tag.nu "$TAG" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ steps.prepare.outputs.tag }}


      - name: Publish to npm
        run: nu scripts/ci/npm_publish.nu --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          git-cliff --latest --strip header --output notes.md || echo "Release $TAG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
